name: Build DialogueForge

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Check the source is stdlib-only
        run: >
          python -c "import ast,sys;
          t=ast.parse(open('src/DialogueForge.py',encoding='utf-8').read());
          m={(n.names[0].name if isinstance(n,ast.Import) else n.module or '').split('.')[0]
          for n in ast.walk(t) if isinstance(n,(ast.Import,ast.ImportFrom))};
          extra=m-set(sys.stdlib_module_names)-{''};
          sys.exit('third-party imports found: %s' % extra) if extra else print('stdlib only')"

      - name: Build folder distribution
        run: >
          python -m PyInstaller --windowed --clean --noconfirm --noupx
          --name DialogueForge --icon src/logo.ico
          --version-file src/version_info.txt
          --onedir --distpath dist_folder src/DialogueForge.py

      - name: Build single-file exe
        run: >
          python -m PyInstaller --windowed --clean --noconfirm --noupx
          --name DialogueForge --icon src/logo.ico
          --version-file src/version_info.txt
          --onefile src/DialogueForge.py

      - name: Smoke test - does it launch and stay up?
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DialogueForge.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            throw "DialogueForge.exe exited immediately (code $($p.ExitCode))."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Launched and stayed running."

      - name: Zip the folder build
        shell: pwsh
        run: Compress-Archive -Path dist_folder\DialogueForge\* -DestinationPath DialogueForge-windows.zip

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash DialogueForge-windows.zip -Algorithm SHA256 | Format-List | Out-File checksums.txt -Encoding utf8
          Get-FileHash dist\DialogueForge.exe -Algorithm SHA256 | Format-List | Out-File checksums.txt -Append -Encoding utf8
          Get-Content checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DialogueForge
          path: |
            DialogueForge-windows.zip
            dist/DialogueForge.exe
            checksums.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DialogueForge-windows.zip
            dist/DialogueForge.exe
            checksums.txt
